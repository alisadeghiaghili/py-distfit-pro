[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veridist"
version = "0.0.0.dev0"
description = "Evidence-first distribution fitting with explicit execution contracts"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com" },
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/py-distfit-pro"
Documentation = "https://github.com/alisadeghiaghili/py-distfit-pro/tree/main/python/docs"
Repository = "https://github.com/alisadeghiaghili/py-distfit-pro"
Issues = "https://github.com/alisadeghiaghili/py-distfit-pro/issues"

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6",
    "mpmath==1.3.0",
    "pytest>=8.3",
    "pytest-cov>=6,<8",
]
mutation = [
    "mutmut==3.7.0",
    "pytest>=8.3",
]
browser = [
    "playwright==1.62.0",
]
lint = [
    "mypy>=1.13",
    "ruff>=0.8",
]
docs = [
    "Sphinx>=8.2,<9",
    "myst-parser>=4,<5",
    "sphinx-intl>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veridist = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["veridist"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# This is intentionally the complete binding critical production scope.  Do not
# add exclusion keys here: the evidence checker rejects them.
[tool.mutmut]
source_paths = [
    "src/veridist/domain",
    "src/veridist/statistics",
    "src/veridist/families",
    "src/veridist/engine",
]
pytest_add_cli_args_test_selection = ["tests/contract", "tests/reference", "tests/unit"]
also_copy = [
    "tools",
    "src/veridist/__init__.py",
    "src/veridist/execution.py",
    "src/veridist/py.typed",
    "src/veridist/adapters",
    "src/veridist/reporting",
]
mutate_only_covered_lines = false
