[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridist"
version = "0.0.0.dev0"
description = "Greenfield, evidence-first distribution fitting"
authors = [
    { name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com" },
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6",
    "pytest>=8.3",
    "pytest-cov>=6,<8",
]
lint = [
    "mypy>=1.13",
    "ruff>=0.8",
]
docs = [
    "Sphinx>=8.2,<9",
    "myst-parser>=4,<5",
    "sphinx-intl>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veridist = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["veridist"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
