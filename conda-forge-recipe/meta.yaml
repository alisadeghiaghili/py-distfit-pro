{% set name = "veridist" %}
{% set version = "0.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alisadeghiaghili/veridist/releases/download/v{{ version }}/veridist-{{ version }}.tar.gz
  sha256: af4ba42eb8ed769964c8860c5cf7c3ccbfab01f43254d4ef30abb3b2793e0a15

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python >=3.11
    - setuptools >=77
  run:
    - numpy >=1.26,<3
    - python >=3.11

test:
  imports:
    - veridist

about:
  home: https://github.com/alisadeghiaghili/veridist
  license: BUSL-1.1
  license_file: LICENSE
  summary: Evidence-first distribution fitting with explicit execution contracts

extra:
  recipe-maintainers:
    - alisadeghiaghili
