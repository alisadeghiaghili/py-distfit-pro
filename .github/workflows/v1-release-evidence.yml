name: veridist-v1-release-evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full candidate SHA to collect and validate
        required: true
        type: string
      source_lock_artifact:
        description: Path to the reviewed competitive source-lock JSON in the candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect-execution-evidence:
    name: collect-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: macos-latest
            platform: macos
          - runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test -z "$(git status --porcelain)"
      - name: Install candidate
        run: python -m pip install --disable-pip-version-check -e .
      - name: Collect complete retry-resume and cancellation facts
        run: >
          python tools/collect_v1_execution_evidence.py
          --candidate-git-sha "${{ inputs.candidate_sha }}"
          --platform "${{ matrix.platform }}"
          --output "../v1-execution-${{ matrix.platform }}.json"
      - name: Upload executed raw platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-execution-${{ matrix.platform }}-${{ inputs.candidate_sha }}
          path: v1-execution-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

  validate-collected-execution:
    needs: collect-execution-evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test -z "$(git status --porcelain)"
      - name: Download all executed platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v1-execution-*-${{ inputs.candidate_sha }}
          path: raw-execution
          merge-multiple: true
      - name: Assemble and validate the executed cross-platform matrix
        run: |
          python tools/assemble_v1_execution_evidence.py \
            --input ../raw-execution/v1-execution-linux.json \
            --input ../raw-execution/v1-execution-macos.json \
            --input ../raw-execution/v1-execution-windows.json \
            --output v1-execution-collected.json \
            --expected-git-sha "${{ inputs.candidate_sha }}"
          python tools/check_v1_execution_evidence.py \
            --artifact v1-execution-collected.json \
            --expected-git-sha "${{ inputs.candidate_sha }}"
      - name: Upload assembled run evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-execution-collected-${{ inputs.candidate_sha }}
          path: python/v1-execution-collected.json
          if-no-files-found: error
          retention-days: 90

  validate-competitive-source-locks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test -z "$(git status --porcelain)"
      - name: Validate competitive source locks
        run: >
          python tools/check_competitive_source_lock.py
          --matrix ../docs/competitive-feature-matrix.csv
          --locks "${{ inputs.source_lock_artifact }}"
