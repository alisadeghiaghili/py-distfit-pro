name: publish-veridist-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish verified release artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" = 1
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
